let MODE="gestore";try{const q=new URLSearchParams(location.search).get("vista"),r=localStorage.getItem("tf1v");MODE=q=="cliente"||q=="gestore"?q:r=="cliente"?"cliente":"gestore"}catch(e){}
V=MODE=="cliente"?"cliente":"ordini";
function setMode(m){MODE=m;V=m=="cliente"?"cliente":"ordini";try{localStorage.setItem("tf1v",m)}catch(e){}render()}
const NT=8,ST={attesa:"In attesa di conferma",nuovo:"In coda in cucina",cooking:"In preparazione",ready:"Pronto da servire",served:"Servito"};
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.className="on";setTimeout(()=>e.className="",2200)}
const items=k=>Object.entries(C[k]).filter(x=>x[1]>0).map(x=>[+x[0],x[1]]);
const food=l=>l.filter(x=>!M(x[0]).s);
function load(){return S.orders.filter(o=>o.st=="nuovo"||o.st=="cooking").reduce((a,o)=>a+food(o.items).reduce((b,x)=>b+M(x[0]).t*x[1],0),0)/S.cooks}
function est(l){const f=food(l);if(!f.length)return 2;const sum=f.reduce((a,x)=>a+M(x[0]).t*x[1],0),mx=Math.max(...f.map(x=>M(x[0]).t));return Math.round(load()+Math.max(mx,sum/S.cooks))}
const tot=l=>l.reduce((a,x)=>a+M(x[0]).p*x[1],0);
const mins=t=>Math.floor((Date.now()-t)/60000);
function send(tb,l,src){
 for(const[id,q]of l){const m=M(id);if(m.s&&S.stock[id]<q)return toast("Scorta insufficiente: "+m.n)}
 const o={id:S.seq++,tb,items:l,src,t:Date.now(),eta:est(l),st:src=="cliente"?"attesa":"nuovo"};
 if(o.st=="nuovo")take(o);S.orders.push(o);save()}
function take(o){o.items.forEach(([id,q])=>{if(M(id).s)S.stock[id]-=q});if(!food(o.items).length)o.st="ready"}
function adv(id){const o=S.orders.find(x=>x.id==id);if(!o||!["nuovo","cooking","ready"].includes(o.st))return;o.st={nuovo:"cooking",cooking:"ready",ready:"served"}[o.st];save();render()}
function conf(id){const o=S.orders.find(x=>x.id==id);for(const[i,q]of o.items)if(M(i).s&&S.stock[i]<q)return toast("Scorta insufficiente: "+M(i).n);take(o);o.st=o.st=="ready"?"ready":"nuovo";o.eta=est(o.items);o.t=Date.now();save();render()}
function rej(id){S.orders=S.orders.filter(x=>x.id!=id);save();render()}
function chg(k,id,d){const q=(C[k][id]||0)+d;C[k][id]=Math.max(0,q);render()}
function go(k,tb){const l=items(k);if(!l.length)return toast("Ordine vuoto");const n=S.orders.length;send(tb,l,k=="cliente"?"cliente":"cameriere");if(S.orders.length>n){C[k]={};toast(k=="cliente"?"Ordine inviato! Il cameriere lo confermerà":"Inviato in cucina ✓")}render()}
const busy=tb=>S.orders.filter(o=>o.tb==tb&&(o.st=="attesa"||o.st=="nuovo"||o.st=="cooking")).length;
function free(tb){const b=busy(tb);if(b)return toast("Non si può chiudere: la cucina non ha ancora finito "+b+(b==1?" ordine":" ordini"));S.orders=S.orders.filter(o=>o.tb!=tb);save();render()}
function stk(id,d){S.stock[id]=Math.max(0,S.stock[id]+d);save();render()}
function menuHTML(k){let h=`<div class="chips">${CATS.map(c=>`<button class="chip" onclick="document.getElementById('${k}-${c}').scrollIntoView({behavior:'smooth'})">${c}</button>`).join("")}</div>`;for(const c of CATS){h+=`<h3 id="${k}-${c}">${c}</h3><div class="card">`;MENU.filter(m=>m.c==c&&!m.h).forEach(m=>{const q=C[k][m.id]||0,left=m.off?0:m.s?S.stock[m.id]-q:9;
 h+=`<div class="row">${ph(m)}<div class="nm">${esc(m.n)}${m.sz?' <span class="pill k">stagione</span>':""}<small>${eur(m.p)} · ${m.off?"non disponibile oggi":m.s?(S.stock[m.id]<=0?"esaurito":"disponibili: "+S.stock[m.id]):m.t+" min"}</small></div><div class="qty"><button aria-label="Rimuovi ${esc(m.n)}" onclick="chg('${k}',${m.id},-1)" ${q?"":"disabled"}>−</button><b aria-live="polite">${q}</b><button aria-label="Aggiungi ${esc(m.n)}" onclick="chg('${k}',${m.id},1)" ${left<=0?"disabled":""}>+</button></div></div>`});h+="</div>"}return h}
function sumHTML(k,tb){const l=items(k);if(!l.length)return"";return`<div class="sum bar"><div><b>${l.reduce((a,x)=>a+x[1],0)} voci · ${eur(tot(l))}</b><br><span class="pill w">⏱ attesa stimata ~${est(l)} min</span></div><button class="bt" onclick="go('${k}',${tb})">${k=="cliente"?"Invia ordine":"Invia in cucina"}</button></div>`}
function lines(o){return o.items.map(x=>x[1]+"× "+esc(M(x[0]).n)).join(", ")}
function vSala(){
 const st=n=>{const os=S.orders.filter(o=>o.tb==n);return os.some(o=>o.st=="ready")?"rdy":os.length?"occ":""};
 let h=`<div class="two"><div><h2>Tavoli</h2><div class="grid">`+Array.from({length:NT},(_,i)=>i+1).map(n=>`<button class="tb ${st(n)} ${n==T?"sel":""}" onclick="T=${n};render()" aria-pressed="${n==T}">T${n}<small>${st(n)=="rdy"?"da servire":st(n)?"occupato":"libero"}</small></button>`).join("")+`</div>
 <p class="note">Cucina: ${S.cooks} cuochi · carico attuale ~${Math.round(load())} min</p></div><div><h2>Tavolo ${T}</h2>`;
 const os=S.orders.filter(o=>o.tb==T);if(!os.length)h+=`<p class="note">Tavolo libero: aggiungi i piatti qui sotto per aprire la comanda.</p>`;
 os.filter(o=>o.st=="attesa").forEach(o=>h+=`<div class="card"><span class="pill r">📱 Ordine dal cliente</span><p>${lines(o)}</p><button class="bt s g" onclick="conf(${o.id})">Conferma</button> <button class="bt s o" onclick="rej(${o.id})">Rifiuta</button></div>`);
 os.filter(o=>o.st=="ready").forEach(o=>h+=`<div class="card"><span class="pill k">Pronto da servire</span><p>${lines(o)}</p><button class="bt s g" onclick="adv(${o.id})">Servito ✓</button></div>`);
 os.filter(o=>o.st=="nuovo"||o.st=="cooking").forEach(o=>h+=`<div class="card"><span class="pill w">${ST[o.st]} · ~${Math.max(1,o.eta-mins(o.t))} min</span><p>${lines(o)}</p></div>`);
 if(os.length){const b=busy(T);h+=`<div class="card bar"><span>Conto parziale: <b>${eur(os.filter(o=>o.st!="attesa").reduce((a,o)=>a+tot(o.items),0))}</b></span><button class="bt s o" onclick="free(${T})" ${b?"disabled":""}>Libera tavolo</button></div>`+(b?`<p class="note">Il tavolo si può liberare solo quando la cucina ha segnato come pronti tutti gli ordini (ancora da finire: ${b}).</p>`:"")}
 return h+`<h2>Nuova comanda</h2>`+menuHTML("sala")+sumHTML("sala",T)+`</div></div>`}
function vCucina(){
 const col=(s,t,btn)=>`<div><h2>${t}</h2>`+(S.orders.filter(o=>o.st==s).map(o=>`<div class="card"><div class="bar"><b>Tavolo ${o.tb}</b><span class="pill ${mins(o.t)>o.eta?"r":"w"}">${mins(o.t)} min / ~${o.eta}</span></div><p>${food(o.items).map(x=>x[1]+"× "+esc(M(x[0]).n)).join("<br>")}</p><button class="bt s g" onclick="adv(${o.id})">${btn}</button></div>`).join("")||`<p class="note">Nessuna comanda</p>`)+`</div>`;
 return`<div class="bar"><h2>Cucina</h2><div class="qty"><span>Cuochi</span><button onclick="S.cooks=Math.max(1,S.cooks-1);save();render()">−</button><b>${S.cooks}</b><button onclick="S.cooks++;save();render()">+</button></div></div><p>Carico: <b>~${Math.round(load())} min</b> di attesa prima di una nuova comanda.</p><div class="cols">${col("nuovo","Nuove","Inizia")}${col("cooking","In preparazione","Pronto ✓")}</div>`}
function vCantina(){
 const low=MENU.filter(m=>m.s&&!m.h&&S.stock[m.id]<=MIN[m.id]);
 return`<h2>Magazzino bevande e cantina</h2>`+(low.length?`<div class="card"><span class="pill r">⚠ Da riordinare</span><p>${low.map(m=>esc(m.n)+" ("+S.stock[m.id]+")").join(" · ")}</p></div>`:"")+`<div class="card">`+MENU.filter(m=>m.s&&!m.h).map(m=>{const s=S.stock[m.id];return`<div class="row">${ph(m)}<div class="nm" style="flex:1">${esc(m.n)}<small>${s} pz · soglia minima ${MIN[m.id]}</small><div class="meter"><i class="${s<=MIN[m.id]?"low":""}" style="width:${Math.min(100,s/MAX[m.id]*100)}%"></i></div></div><div class="qty"><button aria-label="Scarica una unità di ${esc(m.n)}" onclick="stk(${m.id},-1)">−</button><button aria-label="Carica 6 unità di ${esc(m.n)}" onclick="stk(${m.id},6)">+6</button></div></div>`}).join("")+`</div><p class="note">Le scorte si scalano da sole a ogni ordine confermato. Con “+6” registri un carico di merce.</p>`}
function vCliente(){
 const os=S.orders.filter(o=>o.tb==CT&&o.src=="cliente");
 return`<h2>Menu digitale – Tavolo <select onchange="CT=+this.value;render()" style="font:inherit;padding:4px">${Array.from({length:NT},(_,i)=>`<option ${i+1==CT?"selected":""}>${i+1}</option>`).join("")}</select></h2><p class="note">Scegli il tuo tavolo, aggiungi i piatti e invia l'ordine: il cameriere lo confermerà prima che parta in cucina.</p>`+
 os.map(o=>`<div class="card"><span class="pill ${o.st=="ready"||o.st=="served"?"k":"w"}">${ST[o.st]}${o.st=="nuovo"||o.st=="cooking"?" · ~"+Math.max(1,o.eta-mins(o.t))+" min":""}</span><p>${lines(o)}</p></div>`).join("")+menuHTML("cliente")+sumHTML("cliente",CT)}
function tg(id,f){const m=M(id);m[f]=m[f]?0:1;if(m[f])for(const k in C)delete C[k][id];save();render()}
function addDish(){const g=i=>document.getElementById(i).value,n=g("fn").trim(),c=g("fc"),p=parseFloat(g("fp").replace(",",".")),s=c=="Bevande"||c=="Vini";if(!n||!(p>=0))return toast("Inserisci nome e prezzo");const id=S.nid++,m={id,n,c,p,t:s?0:(parseInt(g("ft"))||5),sz:g("fz")=="1"?1:0};if(s){m.s=1;S.stock[id]=Math.max(0,parseInt(g("fq"))||0)}MENU.push(m);save();toast("Aggiunto: "+n);render()}
function vMenu(){
 const row=m=>`<div class="row">${ph(m)}<div class="nm">${esc(m.n)}${m.sz?' <span class="pill k">stagione</span>':""}<small>${eur(m.p)} · ${m.s?"cantina: "+S.stock[m.id]:m.t+" min"}${m.off?" · finito oggi":""}</small></div><div class="acts">${m.h?`<button class="bt s" onclick="tg(${m.id},'h')">Rimetti in menu</button>`:`<button class="bt s ${m.off?"g":"o"}" onclick="tg(${m.id},'off')">${m.off?"Riattiva":"Finito"}</button><button class="bt s o" onclick="tg(${m.id},'h')">Togli</button>`}</div></div>`;
 const hid=MENU.filter(m=>m.h);
 return`<h2>Gestione menu</h2><p class="note">Sala e cucina decidono qui cosa è in carta. <b>Finito</b> blocca subito gli ordini (anche quelli dei clienti) fino alla riattivazione; <b>Togli</b> nasconde il piatto dal menu, ad esempio a fine stagione, senza perdere lo storico.</p><h3>Aggiungi un piatto o un vino</h3><div class="card f"><input id="fn" aria-label="Nome" placeholder="Nome del piatto o del vino" autocomplete="off"><div class="f3"><select id="fc" aria-label="Categoria">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><select id="fz" aria-label="Stagionalità"><option value="0">Sempre in menu</option><option value="1">Piatto di stagione</option></select></div><div class="f3"><input id="fp" aria-label="Prezzo" inputmode="decimal" placeholder="Prezzo €"><input id="ft" aria-label="Minuti in cucina" inputmode="numeric" placeholder="Minuti in cucina"><input id="fq" aria-label="Scorta" inputmode="numeric" placeholder="Scorta (bevande, vini)"></div><button class="bt" onclick="addDish()">Aggiungi al menu</button></div>`+CATS.map(c=>{const l=MENU.filter(m=>m.c==c&&!m.h);return l.length?`<h3>${c}</h3><div class="card">${l.map(row).join("")}</div>`:""}).join("")+(hid.length?`<h3>Fuori menu</h3><div class="card">${hid.map(row).join("")}</div>`:"")}
function vOrdini(){
 const os=S.orders.slice().sort((a,b)=>b.t-a.t),by=f=>os.filter(o=>f.includes(o.st)),
 card=(o,btn)=>`<div class="card"><div class="bar"><b>Tavolo ${o.tb} · ordine n. ${o.id}</b><span class="pill ${o.src=="cliente"?"r":"w"}">${o.src=="cliente"?"📱 dal cliente":"dal cameriere"}</span></div><p>${lines(o)}</p><div class="bar"><span><b>${eur(tot(o.items))}</b> · ${mins(o.t)} min fa · <span class="pill ${o.st=="ready"||o.st=="served"?"k":"w"}">${ST[o.st]}</span></span>${btn||""}</div></div>`,
 sec=(t,l,btn)=>l.length?`<h3>${t} (${l.length})</h3>`+l.map(o=>card(o,btn&&btn(o))).join(""):"",
 conf2=o=>`<span class="acts"><button class="bt s g" onclick="conf(${o.id})">Conferma</button><button class="bt s o" onclick="rej(${o.id})">Rifiuta</button></span>`,
 serv=o=>`<span class="acts"><button class="bt s g" onclick="adv(${o.id})">Servito ✓</button></span>`,
 tabs=[...new Set(os.filter(o=>o.st!="attesa").map(o=>o.tb))].sort((a,b)=>a-b),
 stat=(n,t)=>`<div class="card stat"><b>${n}</b><span>${t}</span></div>`;
 return`<h2>Ordini</h2><div class="stats">${stat(by(["attesa"]).length,"da confermare")}${stat(by(["nuovo","cooking"]).length,"in cucina")}${stat(by(["ready"]).length,"da servire")}${stat(eur(os.filter(o=>o.st!="attesa").reduce((a,o)=>a+tot(o.items),0)),"totale ordini aperti")}</div>`+
 (os.length?"":`<p class="note">Nessun ordine al momento. Quando un cliente ordina dalla vista cliente, l'ordine compare qui da confermare.</p>`)+
 sec("Da confermare",by(["attesa"]),conf2)+sec("In cucina",by(["nuovo","cooking"]))+sec("Pronti da servire",by(["ready"]),serv)+sec("Serviti",by(["served"]))+
 (tabs.length?`<h3>Conto per tavolo</h3><div class="card">${tabs.map(n=>`<div class="row"><span class="nm">Tavolo ${n}</span><b>${eur(os.filter(o=>o.tb==n&&o.st!="attesa").reduce((a,o)=>a+tot(o.items),0))}</b></div>`).join("")}</div>`:"")}
function render(){const y=scrollY,cl=MODE=="cliente";
 if(cl)V="cliente";else if(V=="cliente")V="ordini";
 document.getElementById("mode").innerHTML=[["gestore","🧑‍🍳 Vista gestore"],["cliente","📱 Vista cliente"]].map(([k,t])=>`<button class="${MODE==k?"on":""}" onclick="setMode('${k}')" aria-pressed="${MODE==k}">${t}</button>`).join("");
 document.getElementById("nav").innerHTML=cl?"":[["ordini","🧾 Ordini"],["sala","🍽 Sala"],["cucina","👨‍🍳 Cucina"],["cantina","🍾 Cantina"],["menu","📋 Menu"]].map(([k,t])=>`<button class="${V==k?"on":""}" onclick="V='${k}';render()" ${V==k?'aria-current="page"':""}>${t}</button>`).join("");
 document.getElementById("app").innerHTML={ordini:vOrdini,sala:vSala,cucina:vCucina,cantina:vCantina,cliente:vCliente,menu:vMenu}[V]()+`<p class="note"><b>Versione dimostrativa:</b> i dati restano su questo dispositivo.${cl?"":` <a href="#" onclick="S=DEF();MENU.length=0;MENU.push(...S.menu);S.menu=MENU;save();C={sala:{},cliente:{}};render();return false" style="color:var(--ac)">Azzera demo</a>`}</p>`;scrollTo(0,y)}
render();setInterval(()=>{if(V=="ordini"||V=="cucina"||V=="cliente"||V=="sala")render()},30000);
</script></body></html>
